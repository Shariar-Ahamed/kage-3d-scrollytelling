<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0a0a0e" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#e0231c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e0231c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="toriiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffdcd9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#e0231c" stroke-width="1.8" />

  <!-- Crimson Solar Sphere & Atmospheric Glow -->
  <circle cx="32" cy="31" r="18" fill="url(#sunGlow)" />
  <circle cx="32" cy="30" r="9" fill="#e0231c" opacity="0.9" />

  <!-- Torii Gate Silhouette -->
  <g fill="url(#toriiGrad)" filter="url(#glow)">
    <!-- Top Curved Kasagi (Upper Lintel) -->
    <path d="M12 20 C 22 16.5, 42 16.5, 52 20 C 52.8 20.3, 52.5 21.6, 51.5 22.2 C 41.5 19, 22.5 19, 12.5 22.2 C 11.5 21.6, 11.2 20.3, 12 20 Z" />
    
    <!-- Secondary Lintel (Shimaki) -->
    <path d="M15 22.8 C 23.5 20.8, 40.5 20.8, 49 22.8 L 48.6 25 C 40.5 23.2, 23.5 23.2, 15.4 25 Z" />

    <!-- Central Nameplate (Gaku) -->
    <rect x="30.2" y="24" width="3.6" height="5" rx="0.6" fill="#ffffff" />

    <!-- Horizontal Tie Beam (Nuki) -->
    <rect x="14.5" y="27" width="35" height="3.2" rx="0.8" />

    <!-- Left Pillar (Hashira) slightly sloped inward -->
    <polygon points="21.5,23 24.5,23 23.2,49.5 19.8,49.5" />

    <!-- Right Pillar (Hashira) slightly sloped inward -->
    <polygon points="39.5,23 42.5,23 44.2,49.5 40.8,49.5" />

    <!-- Left Pillar Base (Daiishi) -->
    <rect x="18.5" y="49.5" width="5.8" height="2.5" rx="0.8" fill="#e0231c" />

    <!-- Right Pillar Base (Daiishi) -->
    <rect x="39.7" y="49.5" width="5.8" height="2.5" rx="0.8" fill="#e0231c" />
  </g>
</svg>